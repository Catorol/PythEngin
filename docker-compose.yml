services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rg}
      POSTGRES_DB: ${POSTGRES_DB:-rg}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rg} -d $${POSTGRES_DB:-rg}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rg}:${POSTGRES_PASSWORD:-rg}@db:5432/${POSTGRES_DB:-rg}
      RG_MODEL_DIR: /app/models
      RG_LOG_LEVEL: ${RG_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - modeldata:/app/models

volumes:
  pgdata:
  modeldata:
