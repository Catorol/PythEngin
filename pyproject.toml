[project]
name = "research-graph"
version = "0.1.0"
description = "Data Engineering project structure for TikTok Shop analytics"
readme = "README.md"
authors = [
    { name = "Catorol" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.13.5",
]

[project.scripts]
rg = "research_graph.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=research_graph --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/research_graph"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["src", "tests"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
